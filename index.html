<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preços</title>
<style>
:root{--fundo:#0a1020;--card:#111b33;--borda:#1f2f55;--texto:#e8eefc;--suave:#8fa3cc;--preco:#7ff0b0;--azul:#4da3ff}
*{box-sizing:border-box;margin:0}
body{background:var(--fundo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 14px calc(24px + env(safe-area-inset-bottom,0px))}
.banner{background:linear-gradient(135deg,#123a7a,#0d1f4d 60%,#0a1633);border:1px solid var(--borda);border-radius:18px;padding:26px 16px;text-align:center;margin-bottom:22px}
.banner h1{font-size:22px;line-height:1.25;color:#cfe6ff}
.banner p{font-size:12px;letter-spacing:.06em;color:var(--suave);margin-top:10px}
h2{font-size:15px;color:var(--azul);margin:0 4px 12px}
.plano{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:15px 14px;margin-bottom:10px;font-size:15px;font-weight:600}
.plano b{color:var(--preco);font-weight:700}
.rodape{text-align:center;color:var(--suave);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<!-- EDITE AQUI: nome da loja -->
<div class="banner">
<h1>💎 LOJINHA DO SEU BOT</h1>
<p>PLANOS • ALUGUEL • VIP • SERVIÇOS</p>
</div>

<!-- EDITE AQUI: planos (copie uma linha .plano para cada plano novo) -->
<h2>🤖 PLANOS DE ALUGUEL</h2>
<div class="plano"><span>🧪 12 HORAS</span><b>GRÁTIS</b></div>
<div class="plano"><span>📅 7 DIAS</span><b>R$ 7,00</b></div>
<div class="plano"><span>🗓️ 15 DIAS</span><b>R$ 12,00</b></div>
<div class="plano"><span>📆 1 MÊS</span><b>R$ 19,99</b></div>
<div class="plano"><span>📆 2 MESES</span><b>R$ 39,90</b></div>
<div class="plano"><span>🗓️ 3 MESES</span><b>R$ 55,90</b></div>

<p class="rodape">Copyright © by Chaos</p>
</body>
</html>
